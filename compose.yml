services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24300
        fluentd-async: "true"
        tag: demotory.app

  fluentd:
    build: ./fluentd
    profiles: [observability]
    volumes:
      - ./fluentd/conf:/fluentd/etc
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "24300:24224"
      - "24300:24224/udp"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    profiles: [observability]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      retries: 5
      timeout: 5s
    ports:
      - "9200:9200"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24300
        fluentd-async: "true"
        tag: demotory.elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    profiles: [observability]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24300
        fluentd-async: "true"
        tag: demotory.kibana

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24300
        fluentd-async: "true"
        tag: demotory.prometheus

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24300
        fluentd-async: "true"
        tag: demotory.grafana

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: [observability]
    ports:
      - "16686:16686"
      - "4318:4318"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24300
        fluentd-async: "true"
        tag: demotory.jaeger
